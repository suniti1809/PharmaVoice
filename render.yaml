services:
  - type: web
    name: pharmavoice-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn index:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: AUTO_SEED
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_t38WwdyAcBTb@ep-blue-mouse-b3z4jjmz-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require

  - type: web
    name: pharmavoice
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://pharmavoice-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
